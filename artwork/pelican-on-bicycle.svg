<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="1120" viewBox="0 0 1440 1120" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="title description">
  <title id="title">Пеликан на велосипеде</title>
  <desc id="description">Белый пеликан с длинным золотистым клювом и развевающимся коралловым шарфом едет вправо на бирюзовом велосипеде. Оранжевые перепончатые лапы стоят на педалях, крыло держит руль. Тёплая векторная иллюстрация на светлом фоне.</desc>
