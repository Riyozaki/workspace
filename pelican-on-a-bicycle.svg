  <path d="M358 293L349 270" stroke="#2E3440" stroke-width="16" stroke-linecap="round"/>
  <path d="M358 293L349 270" stroke="#8C97A5" stroke-width="9" stroke-linecap="round"/>
  <path d="M272 292c8-15 30-22 54-19 22 3 38 10 40 19-5 9-25 14-52 13-22-1-36-5-42-13z"
