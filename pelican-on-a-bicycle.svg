  <title id="title">Пеликан на велосипеде</title>
  <desc id="description">Белый пеликан с огромным золотистым клювом и коралловым шарфом
    едет на коралловом велосипеде вдоль моря. Крыло держится за руль,
    перепончатые лапы стоят на педалях. Солнце, лёгкие облака и морской бриз.
    Полностью векторная иллюстрация без растровых изображений.</desc>

