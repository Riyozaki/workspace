<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640"
     role="img" aria-labelledby="title desc">
  <title id="title">Пеликан на велосипеде</title>
  <desc id="desc">Векторная иллюстрация: пеликан в красном шарфе едет на велосипеде с бирюзовой рамой.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D9EDF7"/>
      <stop offset="0.62" stop-color="#F2F6F3"/>
      <stop offset="1" stop-color="#FBF3E4"/>
    </linearGradient>
    <linearGradient id="bodyShade" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EDE7DA"/>
    </linearGradient>
    <linearGradient id="beakGrad" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0" stop-color="#FFC24D"/>
      <stop offset="1" stop-color="#F29A22"/>
    </linearGradient>
    <linearGradient id="pouchGrad" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#F6A93C"/>
      <stop offset="1" stop-color="#E07A1C"/>
    </linearGradient>
    <linearGradient id="frameGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3FA3CB"/>
      <stop offset="1" stop-color="#2277A0"/>
    </linearGradient>
  </defs>

  <g id="outline-style" fill="none" stroke="#2E3440" stroke-width="6"
     stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ============ ФОН ============ -->
  <rect width="900" height="640" fill="url(#sky)"/>
  <circle cx="762" cy="132" r="80" fill="#FFE39B" opacity="0.75"/>
  <circle cx="762" cy="132" r="56" fill="#FFD873" opacity="0.6"/>
  <g fill="#FFFFFF" opacity="0.85">
    <path d="M120 176c14-22 44-26 58-8 16-14 44-8 50 12 20-2 30 10 28 20H104c-4-12 4-22 16-24z"/>
    <path d="M470 92c10-16 32-19 42-6 12-10 32-6 36 9 15-1 22 7 20 15H459c-3-9 3-16 11-18z" opacity="0.7"/>
  </g>
  <path d="M0 520q450-16 900 0v120H0z" fill="#CBDFBB"/>
  <path d="M0 520q450-16 900 0" fill="none" stroke="#A9C69A" stroke-width="5"/>
  <g fill="#A9C69A" opacity="0.75">
    <ellipse cx="118" cy="576" rx="46" ry="10"/>
    <ellipse cx="806" cy="592" rx="60" ry="12"/>
  </g>

  <!-- ============ ТЕНЬ ============ -->
  <ellipse cx="430" cy="528" rx="252" ry="18" fill="#2E3440" opacity="0.13"/>

  <!-- ============ КОЛЁСА ============ -->
  <g id="rear-wheel">
    <circle cx="280" cy="420" r="100" fill="none" stroke="#2E3440" stroke-width="15"/>
    <circle cx="280" cy="420" r="88" fill="none" stroke="#C7CFD8" stroke-width="9"/>
    <path d="M296.0 420.0L370.0 420.0 M293.9 428.0L357.9 465.0 M288.0 433.9L325.0 497.9 M280.0 436.0L280.0 510.0 M272.0 433.9L235.0 497.9 M266.1 428.0L202.1 465.0 M264.0 420.0L190.0 420.0 M266.1 412.0L202.1 375.0 M272.0 406.1L235.0 342.1 M280.0 404.0L280.0 330.0 M288.0 406.1L325.0 342.1 M293.9 412.0L357.9 375.0"
          fill="none" stroke="#9DA8B6" stroke-width="2.6"/>
    <circle cx="280" cy="420" r="17" fill="#2E3440"/>
    <circle cx="280" cy="420" r="7" fill="#7B8694"/>
  </g>
  <g id="front-wheel">
    <circle cx="570" cy="420" r="100" fill="none" stroke="#2E3440" stroke-width="15"/>
    <circle cx="570" cy="420" r="88" fill="none" stroke="#C7CFD8" stroke-width="9"/>
    <path d="M585.5 424.1L656.9 443.3 M581.3 431.3L633.6 483.6 M574.1 435.5L593.3 506.9 M565.9 435.5L546.7 506.9 M558.7 431.3L506.4 483.6 M554.5 424.1L483.1 443.3 M554.5 415.9L483.1 396.7 M558.7 408.7L506.4 356.4 M565.9 404.5L546.7 333.1 M574.1 404.5L593.3 333.1 M581.3 408.7L633.6 356.4 M585.5 415.9L656.9 396.7"
          fill="none" stroke="#9DA8B6" stroke-width="2.6"/>
    <circle cx="570" cy="420" r="17" fill="#2E3440"/>
    <circle cx="570" cy="420" r="7" fill="#7B8694"/>
  </g>

  <!-- ============ ТРАНСМИССИЯ ============ -->
  <g stroke-linecap="round">
    <!-- цепь -->
    <path d="M396 404L286 400" stroke="#2E3440" stroke-width="9"/>
    <path d="M398 456L288 442" stroke="#2E3440" stroke-width="9"/>
    <path d="M396 404L286 400" stroke="#8C97A5" stroke-width="4" stroke-dasharray="3 5"/>
    <path d="M398 456L288 442" stroke="#8C97A5" stroke-width="4" stroke-dasharray="3 5"/>
    <!-- шатуны -->
    <path d="M400 430L426 393" stroke="#2E3440" stroke-width="14"/>
    <path d="M400 430L426 393" stroke="#C7CFD8" stroke-width="7"/>
    <path d="M400 430L382 472" stroke="#2E3440" stroke-width="14"/>
    <path d="M400 430L382 472" stroke="#C7CFD8" stroke-width="7"/>
    <!-- звезда -->
    <circle cx="280" cy="420" r="22" fill="#2E3440"/>
    <circle cx="280" cy="420" r="22" fill="none" stroke="#8C97A5" stroke-width="4" stroke-dasharray="4 4"/>
    <circle cx="400" cy="430" r="30" fill="#2E3440"/>
    <circle cx="400" cy="430" r="30" fill="none" stroke="#8C97A5" stroke-width="5" stroke-dasharray="5 5"/>
    <circle cx="400" cy="430" r="11" fill="#7B8694"/>
  </g>
  <!-- дальняя педаль -->
  <g transform="rotate(-32 426 393)">
    <rect x="404" y="385" width="44" height="16" rx="6" fill="#2E3440"/>
