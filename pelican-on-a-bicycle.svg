  <!-- корпус -->
  <g transform="rotate(-7 325 205)">
    <ellipse cx="325" cy="205" rx="98" ry="74" fill="url(#bodyShade)" stroke="#2E3440" stroke-width="6"/>
    <path d="M257 262c34 22 92 22 130 2-16 24-66 34-104 20-16-6-26-14-26-22z"
          fill="#DCD5C6" opacity="0.85"/>
    <path d="M280 150c34-16 76-14 100 6" fill="none" stroke="#FFFFFF" stroke-width="10" opacity="0.9" stroke-linecap="round"/>
  </g>

  <!-- голова -->
  <circle cx="460" cy="106" r="44" fill="url(#bodyShade)" stroke="#2E3440" stroke-width="6"/>
  <path d="M430 74c16-10 40-8 52 6" fill="none" stroke="#FFFFFF" stroke-width="9" opacity="0.9" stroke-linecap="round"/>
  <!-- хохолок -->
  <path d="M436 64c-4-16 2-26 12-30 2 12 8 18 16 22-6 6-16 10-28 8z"
        fill="#FFFFFF" stroke="#2E3440" stroke-width="6" stroke-linejoin="round"/>

  <!-- клюв -->
  <path d="M494 100c64-8 140 4 180 30-38-4-108-8-180-8z"
        fill="url(#beakGrad)" stroke="#2E3440" stroke-width="6" stroke-linejoin="round"/>
  <path d="M496 112C506 168 546 202 596 202c42 0 72-24 80-60z"
