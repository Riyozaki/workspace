  <path d="M502 118c6 46 44 78 92 78" fill="none" stroke="#C96A12" stroke-width="3.5" opacity="0.75"/>
  <path d="M528 168c22 16 52 22 84 14" fill="none" stroke="#C96A12" stroke-width="3" opacity="0.55"/>
  <path d="M520 104c52-4 110 4 144 22" fill="none" stroke="#D98611" stroke-width="3" opacity="0.7"/>
  <circle cx="540" cy="106" r="4" fill="#C96A12"/>

  <!-- глаз -->
  <circle cx="466" cy="94" r="10" fill="#2E3440"/>
  <circle cx="469" cy="90" r="3.4" fill="#FFFFFF"/>
  <path d="M452 78c8-6 20-6 28 0" fill="none" stroke="#2E3440" stroke-width="5" stroke-linecap="round"/>

  <!-- шарф -->
  <path d="M392 152c14-16 34-26 56-28l8 24c-22 2-40 12-50 26z"
        fill="#E4572E" stroke="#2E3440" stroke-width="6" stroke-linejoin="round"/>
  <path d="M400 150c-26 6-58 2-92-14 22-2 42-8 56-18 10 14 24 26 36 32z"
        fill="#E4572E" stroke="#2E3440" stroke-width="6" stroke-linejoin="round"/>
  <path d="M396 132c-30 10-62 12-88 4" fill="none" stroke="#B23C1B" stroke-width="3.5"/>
  <g stroke="#2E3440" stroke-width="6" stroke-linejoin="round">
    <path d="M312 138c-24 6-48 2-64-10 14-8 30-10 46-6z" fill="#E4572E"/>
    <path d="M282 138c-22 12-42 12-58 4 10 14 28 20 46 16z" fill="#F07A4A"/>
  </g>

  <!-- ============ РУЛЬ ============ -->
  <path d="M515 255L522 236" stroke="#2E3440" stroke-width="16" stroke-linecap="round"/>
  <path d="M515 255L522 236" stroke="#8C97A5" stroke-width="9" stroke-linecap="round"/>
  <path d="M522 239c-14-14-38-14-54 2-10 10-14 22-10 32" fill="none" stroke="#2E3440"
