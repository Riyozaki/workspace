  <!-- ============ БЛИЖНЕЕ КРЫЛО ============ -->
  <path d="M344 156c42-4 78 18 100 54 12 20 22 40 22 54-14 6-32 0-46-18-28-36-56-70-76-90z"
        fill="#FFFFFF" stroke="#2E3440" stroke-width="6" stroke-linejoin="round"/>
  <g fill="none" stroke="#CFC8B8" stroke-width="3.5" stroke-linecap="round">
    <path d="M376 176c18 24 34 52 44 84"/>
    <path d="M404 190c16 24 32 50 38 76"/>
    <path d="M430 208c12 20 24 42 28 64"/>
  </g>
  <path d="M352 162c30-2 58 12 78 38" fill="none" stroke="#FFFFFF" stroke-width="8" opacity="0.9" stroke-linecap="round"/>

  <!-- ============ БЛИЖНЯЯ ЛАПА + ПЕДАЛЬ ============ -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M350 246L398 328L378 434" stroke="#2E3440" stroke-width="29"/>
    <path d="M350 246L398 328L378 434" stroke="#F5A623" stroke-width="19"/>
  </g>
  <path d="M366 434c-12 10-18 22-16 32 14 6 30 6 44 0 2-10-6-22-18-32z"
        fill="#F5A623" stroke="#2E3440" stroke-width="6" stroke-linejoin="round"/>
  <path d="M368 452h28" stroke="#C97F10" stroke-width="3"/>
  <g transform="rotate(14 382 472)">
    <rect x="356" y="464" width="52" height="18" rx="7" fill="#2E3440"/>
    <rect x="360" y="468" width="44" height="10" rx="4" fill="#7B8694"/>
  </g>

  <!-- ============ ЛИНИИ ДВИЖЕНИЯ ============ -->
  <g fill="none" stroke="#9DA8B6" stroke-width="7" stroke-linecap="round" opacity="0.75">
    <path d="M96 372c26-6 48-4 66 4"/>
    <path d="M66 420c22-4 42-2 58 6"/>
    <path d="M104 466c22-4 40 0 54 8"/>
    <path d="M126 512c18-4 34 0 46 6"/>
  </g>
  <g fill="#FFFFFF" opacity="0.85">
    <circle cx="176" cy="498" r="16"/>
    <circle cx="214" cy="512" r="11"/>
    <circle cx="150" cy="524" r="9"/>
  </g>
</svg>
