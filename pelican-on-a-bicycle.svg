    <g stroke="#2E3440" stroke-width="21">
      <path d="M280 420L400 430"/>
      <path d="M280 420L358 293"/>
      <path d="M400 430L358 293"/>
      <path d="M400 430L528 298"/>
      <path d="M358 293L515 255"/>
      <path d="M515 255L528 298"/>
      <path d="M528 298L570 420"/>
    </g>
    <g stroke="url(#frameGrad)" stroke-width="13">
      <path d="M280 420L400 430"/>
      <path d="M280 420L358 293"/>
      <path d="M400 430L358 293"/>
      <path d="M400 430L528 298"/>
      <path d="M358 293L515 255"/>
      <path d="M515 255L528 298"/>
      <path d="M528 298L570 420"/>
    </g>
    <!-- блики -->
    <g stroke="#A9DDF2" stroke-width="3" opacity="0.75">
      <path d="M300 424L396 432"/>
      <path d="M366 290L508 258"/>
      <path d="M404 424L522 300"/>
    </g>
  </g>

  <!-- фляга на нижней трубе -->
  <g transform="translate(497 331) rotate(-46)">
    <rect x="-13" y="-33" width="26" height="62" rx="9" fill="#5FC2E0" stroke="#2E3440" stroke-width="5"/>
    <rect x="-8" y="-28" width="16" height="22" rx="6" fill="#9AE4F7"/>
    <rect x="-7" y="-41" width="14" height="11" rx="4" fill="#3A4250" stroke="#2E3440" stroke-width="4"/>
  </g>

