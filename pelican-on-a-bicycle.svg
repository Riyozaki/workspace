  <path d="M288 282c12-6 28-7 42-4" fill="none" stroke="#8C97A5" stroke-width="3.5" stroke-linecap="round"/>

  <!-- ============ ДАЛЬНЯЯ ЛАПА ============ -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M336 242L376 322L414 386" stroke="#2E3440" stroke-width="26"/>
    <path d="M336 242L376 322L414 386" stroke="#D1861B" stroke-width="16"/>
  </g>

  <!-- ============ ПЕЛИКАН ============ -->
  <!-- шея -->
  <g fill="none" stroke-linecap="round">
    <path d="M368 196c10-46 40-76 82-88" stroke="#2E3440" stroke-width="76"/>
    <path d="M368 196c10-46 40-76 82-88" stroke="#FFFFFF" stroke-width="64"/>
    <path d="M372 190c12-40 38-66 74-78" stroke="#EFE9DC" stroke-width="14" opacity="0.9"/>
  </g>
  <!-- хвост -->
  <path d="M248 168c-40-18-80-20-104-8 20 10 30 24 32 38 26-2 48-10 68-4z"
