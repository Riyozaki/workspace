<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="900" height="650"
     role="img" aria-labelledby="title desc">
  <title id="title">Пеликан на велосипеде</title>
  <desc id="desc">Белый пеликан с длинным клювом и горловым мешком едет на красном велосипеде:
  перепончатые лапы на педалях, крыло сложено вдоль туловища, позади — линии движения.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8f4fc"/>
      <stop offset="0.62" stop-color="#f6fbfe"/>
      <stop offset="1" stop-color="#eef4f8"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dfe8ef"/>
      <stop offset="1" stop-color="#eef4f8"/>
    </linearGradient>
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7f93a6" stop-opacity="0.45"/>
      <stop offset="0.65" stop-color="#7f93a6" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#7f93a6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#f7fafc"/>
      <stop offset="1" stop-color="#e6edf4"/>
    </linearGradient>
    <linearGradient id="wing" x1="0.1" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#f4f8fb"/>
      <stop offset="1" stop-color="#d7e2ec"/>
    </linearGradient>
    <linearGradient id="beak" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#f7c04a"/>
      <stop offset="1" stop-color="#ee9c2b"/>
    </linearGradient>
    <linearGradient id="pouch" x1="0" y1="0" x2="0.1" y2="1">
      <stop offset="0" stop-color="#f9d089"/>
      <stop offset="1" stop-color="#f2a94a"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ef5a52"/>
      <stop offset="1" stop-color="#d8413c"/>
    </linearGradient>
    <linearGradient id="saddle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5c4332"/>
      <stop offset="1" stop-color="#3d2b20"/>
    </linearGradient>
  </defs>

  <!-- ============================================================= фон ===== -->
  <g id="background">
    <rect width="900" height="650" fill="url(#sky)"/>
    <g fill="#ffffff" opacity=".8">
      <ellipse cx="150" cy="118" rx="66" ry="26"/>
      <ellipse cx="200" cy="104" rx="48" ry="24"/>
      <ellipse cx="106" cy="110" rx="40" ry="20"/>
      <ellipse cx="772" cy="288" rx="54" ry="20" opacity=".75"/>
      <ellipse cx="810" cy="276" rx="38" ry="17" opacity=".75"/>
    </g>
    <circle cx="812" cy="88" r="42" fill="#ffe9a8" opacity=".7"/>
    <circle cx="812" cy="88" r="28" fill="#ffdf85" opacity=".85"/>
    <rect y="562" width="900" height="88" fill="url(#ground)"/>
    <line x1="0" y1="562" x2="900" y2="562" stroke="#c3d1dc" stroke-width="3"/>
    <g stroke="#c3d1dc" stroke-width="4" stroke-linecap="round" opacity=".55">
      <line x1="70" y1="598" x2="190" y2="598"/>
      <line x1="320" y1="618" x2="470" y2="618"/>
      <line x1="660" y1="600" x2="748" y2="600"/>
    </g>
  </g>

  <!-- ======================================================== движение ===== -->
  <g id="motion" stroke="#a9cde6" stroke-linecap="round" fill="none">
    <path d="M 92 372 h 90" stroke-width="7"/>
    <path d="M 56 412 h 126" stroke-width="7"/>
    <path d="M 104 452 h 76" stroke-width="7"/>
    <path d="M 146 334 h 54" stroke-width="6" opacity=".8"/>
  </g>
  <g id="shadows">
    <ellipse cx="452" cy="566" rx="298" ry="21" fill="url(#shadow)"/>
    <ellipse cx="250" cy="565" rx="94" ry="13" fill="url(#shadow)"/>
    <ellipse cx="656" cy="565" rx="94" ry="13" fill="url(#shadow)"/>
  </g>

  <!-- ========================================================== колёса ===== -->
  <g id="wheels">
  <g>
    <circle cx="250.0" cy="446.0" r="104.0" fill="none" stroke="#2c323a" stroke-width="17"/>
    <circle cx="250.0" cy="446.0" r="95.5" fill="none" stroke="#454c56" stroke-width="1.6" opacity=".7"/>
    <circle cx="250.0" cy="446.0" r="91.0" fill="none" stroke="#c7ced7" stroke-width="6"/>
    <g stroke="#aab4c0" stroke-width="2.4" stroke-linecap="round">
      <line x1="163.0" y1="446.0" x2="337.0" y2="446.0" transform="rotate(0.00 250.0 446.0)"/>
      <line x1="163.0" y1="446.0" x2="337.0" y2="446.0" transform="rotate(22.50 250.0 446.0)"/>
      <line x1="163.0" y1="446.0" x2="337.0" y2="446.0" transform="rotate(45.00 250.0 446.0)"/>
      <line x1="163.0" y1="446.0" x2="337.0" y2="446.0" transform="rotate(67.50 250.0 446.0)"/>
      <line x1="163.0" y1="446.0" x2="337.0" y2="446.0" transform="rotate(90.00 250.0 446.0)"/>
      <line x1="163.0" y1="446.0" x2="337.0" y2="446.0" transform="rotate(112.50 250.0 446.0)"/>
      <line x1="163.0" y1="446.0" x2="337.0" y2="446.0" transform="rotate(135.00 250.0 446.0)"/>
      <line x1="163.0" y1="446.0" x2="337.0" y2="446.0" transform="rotate(157.50 250.0 446.0)"/>
    </g>
    <line x1="250.0" y1="446.0" x2="283.3" y2="363.5" stroke="#6f7a87" stroke-width="3"/>
  </g>
  <g>
    <circle cx="656.0" cy="446.0" r="104.0" fill="none" stroke="#2c323a" stroke-width="17"/>
    <circle cx="656.0" cy="446.0" r="95.5" fill="none" stroke="#454c56" stroke-width="1.6" opacity=".7"/>
    <circle cx="656.0" cy="446.0" r="91.0" fill="none" stroke="#c7ced7" stroke-width="6"/>
    <g stroke="#aab4c0" stroke-width="2.4" stroke-linecap="round">
      <line x1="569.0" y1="446.0" x2="743.0" y2="446.0" transform="rotate(0.00 656.0 446.0)"/>
      <line x1="569.0" y1="446.0" x2="743.0" y2="446.0" transform="rotate(22.50 656.0 446.0)"/>
      <line x1="569.0" y1="446.0" x2="743.0" y2="446.0" transform="rotate(45.00 656.0 446.0)"/>
      <line x1="569.0" y1="446.0" x2="743.0" y2="446.0" transform="rotate(67.50 656.0 446.0)"/>
      <line x1="569.0" y1="446.0" x2="743.0" y2="446.0" transform="rotate(90.00 656.0 446.0)"/>
      <line x1="569.0" y1="446.0" x2="743.0" y2="446.0" transform="rotate(112.50 656.0 446.0)"/>
      <line x1="569.0" y1="446.0" x2="743.0" y2="446.0" transform="rotate(135.00 656.0 446.0)"/>
      <line x1="569.0" y1="446.0" x2="743.0" y2="446.0" transform="rotate(157.50 656.0 446.0)"/>
    </g>
    <line x1="656.0" y1="446.0" x2="689.3" y2="363.5" stroke="#6f7a87" stroke-width="3"/>
  </g>
  </g>

  <!-- ======================================= дальняя лапа (за рамой) ======== -->
  <g id="leg-far" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 396 250 Q 430 290 442 330 Q 428 372 415 405"
          stroke="#39414a" stroke-width="14"/>
    <path d="M 396 250 Q 430 290 442 330 Q 428 372 415 405"
          stroke="#5b646e" stroke-width="9"/>
    <g transform="translate(413 414) rotate(-10)">
      <path d="M -15 -2 C -15 -11 -4 -15 5 -14 C 16 -13 26 -8 29 -2 C 30 1 26 3 19 3 L -11 3 C -14 3 -15 1 -15 -2 Z"
            fill="#d98f33" stroke="#a96a22" stroke-width="2"/>
      <g stroke="#b9762a" stroke-width="1.8" stroke-linecap="round">
        <line x1="20" y1="2" x2="24" y2="-6"/><line x1="11" y1="2" x2="13" y2="-9"/><line x1="2" y1="2" x2="2" y2="-10"/>
      </g>
    </g>
  </g>

  <!-- ============================================================ рама ===== -->
  <g id="frame">
    <path d="M 250 446 Q 352 468 452 462" stroke="#b32a26" stroke-width="15" fill="none" stroke-linecap="round"/>
    <path d="M 250 446 Q 352 468 452 462" stroke="url(#frame)" stroke-width="11" fill="none" stroke-linecap="round"/>
    <path d="M 250 446 Q 322 366 394 296" stroke="#b32a26" stroke-width="14" fill="none" stroke-linecap="round"/>
    <path d="M 250 446 Q 322 366 394 296" stroke="url(#frame)" stroke-width="10" fill="none" stroke-linecap="round"/>
    <path d="M 618 306 Q 636 376 656 446" stroke="#b32a26" stroke-width="16" fill="none" stroke-linecap="round"/>
    <path d="M 618 306 Q 636 376 656 446" stroke="url(#frame)" stroke-width="12" fill="none" stroke-linecap="round"/>
    <path d="M 452.0 462.0 L 392.0 290.0" stroke="#b32a26" stroke-width="18" stroke-linecap="round" fill="none"/>
    <path d="M 452.0 462.0 L 392.0 290.0" stroke="url(#frame)" stroke-width="13" stroke-linecap="round" fill="none"/>
    <path d="M 452.0 462.0 L 618.0 306.0" stroke="#b32a26" stroke-width="19" stroke-linecap="round" fill="none"/>
    <path d="M 452.0 462.0 L 618.0 306.0" stroke="url(#frame)" stroke-width="14" stroke-linecap="round" fill="none"/>
    <path d="M 392.0 290.0 L 600.0 264.0" stroke="#b32a26" stroke-width="16" stroke-linecap="round" fill="none"/>
    <path d="M 392.0 290.0 L 600.0 264.0" stroke="url(#frame)" stroke-width="11" stroke-linecap="round" fill="none"/>
    <path d="M 599 258 L 620 310" stroke="#b32a26" stroke-width="21" fill="none" stroke-linecap="round"/>
    <path d="M 599 258 L 620 310" stroke="url(#frame)" stroke-width="17" fill="none" stroke-linecap="round"/>
    <!-- подседельный штырь и седло -->
    <path d="M 392 292 L 392 276" stroke="#9aa4b0" stroke-width="11" stroke-linecap="round"/>
    <path d="M 392 292 L 392 276" stroke="#d3d9e0" stroke-width="6" stroke-linecap="round"/>
    <path d="M 332 274 C 350 263 394 259 418 268 C 428 272 424 282 406 284 L 350 287 C 336 287 326 281 332 274 Z"
          fill="url(#saddle)" stroke="#2c1e16" stroke-width="2.5"/>
    <!-- рулевая колонка и руль -->
    <path d="M 600 260 L 594 226" stroke="#9aa4b0" stroke-width="12" stroke-linecap="round"/>
    <path d="M 600 260 L 594 226" stroke="#d3d9e0" stroke-width="7" stroke-linecap="round"/>
    <path d="M 650 242 C 632 218 598 216 560 240" fill="none" stroke="#333a43" stroke-width="9" stroke-linecap="round"/>
    <path d="M 560 240 C 566 234 572 229 579 226" fill="none" stroke="#22272e" stroke-width="13" stroke-linecap="round"/>
    <path d="M 650 242 C 645 235 640 230 634 226" fill="none" stroke="#22272e" stroke-width="13" stroke-linecap="round"/>
    <circle cx="606" cy="222" r="7" fill="#f0c33c" stroke="#c79a22" stroke-width="2"/>
  </g>

  <!-- ============================================== трансмиссия, педали ===== -->
  <g id="drivetrain">
    <path d="M 451.8 429.0 L 249.9 430.0 A 16.0 16.0 0 1 0 247.4 461.8 L 446.6 494.6 A 33.0 33.0 0 1 0 451.8 429.0 Z" fill="none" stroke="#6c757f" stroke-width="6" stroke-linejoin="round"/>
    <path d="M 451.8 429.0 L 249.9 430.0 A 16.0 16.0 0 1 0 247.4 461.8 L 446.6 494.6 A 33.0 33.0 0 1 0 451.8 429.0 Z" fill="none" stroke="#aab3bd" stroke-width="2" stroke-dasharray="5 4"/>
    <circle cx="250" cy="446" r="13" fill="none" stroke="#9aa4b0" stroke-width="6"/>
    <path d="M 452 462 L 411.0 421.0" stroke="#7d8894" stroke-width="11" stroke-linecap="round"/>
    <g transform="translate(411.0 421.0) rotate(-10)">
      <rect x="-23" y="-6" width="46" height="12" rx="4" fill="#333a43" stroke="#22272e" stroke-width="2"/>
      <line x1="-15" y1="-2" x2="15" y2="-2" stroke="#5b646e" stroke-width="2.4"/>
    </g>
    <circle cx="452" cy="462" r="30" fill="none" stroke="#9aa4b0" stroke-width="7"/>
    <circle cx="452" cy="462" r="22" fill="none" stroke="#d3d9e0" stroke-width="3"/>
    <path d="M 452 462 L 493.0 503.0" stroke="#d3d9e0" stroke-width="12" stroke-linecap="round"/>
    <path d="M 452 462 L 493.0 503.0" stroke="#8e99a5" stroke-width="4" stroke-linecap="round"/>
    <circle cx="452" cy="462" r="9" fill="#d3d9e0" stroke="#7d8894" stroke-width="2.5"/>
  </g>

  <!-- ======================================== ближняя лапа (перед рамой) ==== -->
  <g id="leg-near" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 400 256 Q 448 302 472 368 Q 492 424 491 487"
          stroke="#4a535d" stroke-width="16"/>
    <path d="M 400 256 Q 448 302 472 368 Q 492 424 491 487"
          stroke="#6d7783" stroke-width="10"/>
    <circle cx="472" cy="368" r="6.5" fill="#6d7783" stroke="none"/>
  </g>

  <!-- ======================================================== пеликан ====== -->
  <g id="pelican">
    <!-- хвост -->
    <path d="M 312 226 C 276 226 242 242 218 266 C 244 254 262 252 278 256
             C 256 262 238 274 228 292 C 256 278 288 268 318 264 Z"
          fill="url(#wing)" stroke="#9fb0c0" stroke-width="3.4" stroke-linejoin="round"/>
    <g stroke="#9fb0c0" stroke-width="2.2" fill="none" opacity=".8">
      <path d="M 284 240 C 264 244 246 252 232 262"/>
      <path d="M 288 256 C 270 262 254 270 242 280"/>
    </g>

    <!-- силуэт: туловище + шея + голова одним контуром (без швов) -->
    <path d="M 300 240
      C 300 190 330 148 382 138
      C 412 132 440 140 454 158
      C 464 130 492 104 522 98
      C 530 74 556 62 582 72
      C 604 80 610 98 602 114
      C 598 130 586 140 568 144
      C 536 152 510 174 492 198
      C 482 220 478 246 452 264
      C 420 282 372 282 340 270
      C 318 262 298 256 300 240 Z"
      fill="url(#body)" stroke="#9fb0c0" stroke-width="3.6" stroke-linejoin="round"/>

    <!-- мягкая тень по низу туловища -->
    <path d="M 336 266 C 372 278 420 276 450 260 C 470 248 478 228 484 210
             C 486 236 476 258 452 272 C 420 288 366 286 336 266 Z"
          fill="#cfdbe6" opacity=".5"/>

    <!-- крыло -->
    <path d="M 442 174 C 472 194 468 234 432 252 C 398 268 348 268 318 250
             C 304 241 308 226 326 222 C 362 212 406 192 442 174 Z"
          fill="url(#wing)" stroke="#9fb0c0" stroke-width="3.4" stroke-linejoin="round"/>
    <g stroke="#9fb0c0" stroke-width="2.4" fill="none" opacity=".85">
      <path d="M 352 224 C 380 232 400 244 410 258"/>
      <path d="M 378 212 C 402 222 420 234 430 248"/>
      <path d="M 402 200 C 422 210 438 222 446 236"/>
    </g>
    <path d="M 318 250 C 336 260 360 264 380 260 C 358 268 330 264 318 250 Z" fill="#c3d2df" opacity=".7"/>


    <!-- клюв + горловой мешок -->
    <path d="M 594 100
      C 658 108 718 128 768 148
      C 764 166 740 184 706 196
      C 660 212 608 198 586 164
      C 582 144 585 118 594 100 Z"
      fill="url(#pouch)" stroke="#d3821f" stroke-width="3.2" stroke-linejoin="round"/>
    <path d="M 596 111 C 662 121 718 138 768 150"
          fill="none" stroke="url(#beak)" stroke-width="13" stroke-linecap="round"/>
    <path d="M 596 111 C 662 121 718 138 768 150"
          fill="none" stroke="#d3821f" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M 610 140 C 652 152 696 166 736 176" fill="none" stroke="#e9a445" stroke-width="3" opacity=".75"/>
    <path d="M 604 156 C 638 172 674 184 702 190" fill="none" stroke="#e0913a" stroke-width="2.6" opacity=".6"/>
    <g opacity=".3" transform="translate(652 166) rotate(14)">
      <path d="M -30 0 C -22 -10 -6 -13 6 -8 C 14 -5 20 -2 24 0 C 20 2 14 5 6 8 C -6 13 -22 10 -30 0 Z" fill="#a8611a"/>
      <path d="M 24 0 L 38 -9 C 34 -3 34 3 38 9 Z" fill="#a8611a"/>
      <circle cx="-18" cy="-3" r="2.2" fill="#f9d089"/>
    </g>
    <!-- крючок на кончике клюва -->
    <path d="M 768 148 C 775 157 770 165 760 163 C 766 159 768 153 764 148 Z" fill="#d3821f"/>
    <!-- ноздря -->
    <ellipse cx="618" cy="118" rx="7" ry="3.4" fill="#cf8b2c" opacity=".85" transform="rotate(9 618 118)"/>

    <!-- глаз -->
    <circle cx="578" cy="98" r="11" fill="#fdfefe" stroke="#9fb0c0" stroke-width="2.2"/>
    <circle cx="580" cy="98" r="6.6" fill="#2c333a"/>
    <circle cx="582.4" cy="95.4" r="2.3" fill="#ffffff"/>
    <ellipse cx="564" cy="122" rx="12" ry="6" fill="#f3b9a0" opacity=".35"/>
  </g>

  <!-- ================================ ближняя педаль и ступицы поверх ======== -->
  <g id="front-most">
    <g transform="translate(493.0 503.0) rotate(6)">
      <rect x="-24" y="-5" width="48" height="13" rx="4" fill="#333a43" stroke="#22272e" stroke-width="2"/>
      <line x1="-16" y1="-1" x2="16" y2="-1" stroke="#5b646e" stroke-width="2.4"/>
    </g>
    <g transform="translate(495 494) rotate(6)">
      <path d="M -17 -2 C -17 -12 -5 -17 6 -16 C 18 -15 29 -9 32 -2 C 33 1 29 3 21 3 L -13 3 C -16 3 -17 1 -17 -2 Z"
            fill="#f0a33c" stroke="#c07c26" stroke-width="2.2"/>
      <g stroke="#cf8a2e" stroke-width="2" stroke-linecap="round">
        <line x1="22" y1="2" x2="27" y2="-7"/><line x1="12" y1="2" x2="14" y2="-10"/><line x1="2" y1="2" x2="2" y2="-11"/>
      </g>
    </g>
    <g id="hub-caps">
      <circle cx="250" cy="446" r="10" fill="#9aa4b0"/>
      <circle cx="250" cy="446" r="5.5" fill="#d3d9e0"/>
      <circle cx="656" cy="446" r="10" fill="#9aa4b0"/>
      <circle cx="656" cy="446" r="5.5" fill="#d3d9e0"/>
    </g>
  </g>
</svg>
