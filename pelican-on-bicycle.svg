<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" width="720" height="520" role="img" aria-labelledby="ttl desc">
  <title id="ttl">Пеликан на велосипеде</title>
  <desc id="desc">Мультяшный пеликан в кепке едет на красном велосипеде по дороге; у клюва в мешке болтается рыбка.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe8fb"/>
      <stop offset="0.65" stop-color="#e4f4fd"/>
      <stop offset="1" stop-color="#f7fbfd"/>
    </linearGradient>
    <radialGradient id="sunG" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6cf"/>
      <stop offset="1" stop-color="#ffd95e"/>
    </radialGradient>
    <linearGradient id="roadG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6d7b8a"/>
      <stop offset="1" stop-color="#4b5763"/>
    </linearGradient>
    <linearGradient id="frameG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ef4d55"/>
      <stop offset="1" stop-color="#bf2a37"/>
    </linearGradient>
    <linearGradient id="bodyG" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#f3f6f8"/>
      <stop offset="1" stop-color="#d6e0e7"/>
    </linearGradient>
    <linearGradient id="billG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc978"/>
      <stop offset="1" stop-color="#f0952c"/>
    </linearGradient>
    <linearGradient id="pouchG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd79a"/>
      <stop offset="1" stop-color="#f3a13e"/>
    </linearGradient>
    <linearGradient id="legG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb04d"/>
      <stop offset="1" stop-color="#ea7f22"/>
    </linearGradient>
    <linearGradient id="tyreG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a444f"/>
      <stop offset="1" stop-color="#20272e"/>
    </linearGradient>

    <!-- спицы одного колеса (9 линий = 18 спиц) -->
    <g id="spokes" stroke="#a9b8c4" stroke-width="2.4" stroke-linecap="round">
      <line x1="-72" y1="0" x2="72" y2="0"/>
      <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(20)"/>
      <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(40)"/>
      <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(60)"/>
      <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(80)"/>
      <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(100)"/>
      <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(120)"/>
      <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(140)"/>
      <line x1="-72" y1="0" x2="72" y2="0" transform="rotate(160)"/>
    </g>

    <clipPath id="scene">
      <rect x="0" y="0" width="720" height="520" rx="20"/>
    </clipPath>
  </defs>

  <g clip-path="url(#scene)">
    <!-- ===== фон ===== -->
    <rect x="0" y="0" width="720" height="520" fill="url(#sky)"/>
    <circle cx="612" cy="84" r="46" fill="url(#sunG)"/>
    <g fill="#ffffff" opacity="0.92">
      <path d="M96 116 q14 -30 46 -22 q16 -24 44 -10 q30 -8 32 20 q22 4 14 22 H86 q-14 -4 10 -10 Z"/>
      <path d="M430 74 q10 -22 34 -16 q12 -18 32 -8 q22 -6 24 14 q16 4 10 16 H424 q-10 -2 6 -6 Z" opacity="0.8"/>
      <path d="M560 190 q8 -16 26 -12 q10 -14 24 -6 q18 -4 18 12 q12 2 8 12 H554 q-8 -2 6 -6 Z" opacity="0.55"/>
    </g>
    <!-- дальние холмы -->
    <path d="M0 412 q90 -54 190 -14 q70 28 140 -6 q90 -44 180 6 q60 32 210 -8 V438 H0 Z" fill="#b7d8c3" opacity="0.7"/>

    <!-- ===== дорога ===== -->
    <rect x="0" y="428" width="720" height="92" fill="url(#roadG)"/>
    <rect x="0" y="428" width="720" height="5" fill="#8d9aa6"/>
    <g stroke="#f4e9c8" stroke-width="7" stroke-linecap="round" opacity="0.9">
      <line x1="20" y1="478" x2="86" y2="478"/>
      <line x1="146" y1="478" x2="212" y2="478"/>
      <line x1="272" y1="478" x2="338" y2="478"/>
      <line x1="398" y1="478" x2="464" y2="478"/>
      <line x1="524" y1="478" x2="590" y2="478"/>
      <line x1="650" y1="478" x2="716" y2="478"/>
    </g>

    <!-- тень под велосипедом -->
    <ellipse cx="290" cy="432" rx="215" ry="13" fill="#22303c" opacity="0.28"/>

    <!-- ===== линии скорости ===== -->
    <g stroke="#ffffff" stroke-linecap="round" opacity="0.85">
      <line x1="26" y1="182" x2="104" y2="182" stroke-width="7"/>
      <line x1="10" y1="222" x2="64" y2="222" stroke-width="6"/>
      <line x1="42" y1="262" x2="118" y2="262" stroke-width="7"/>
      <line x1="16" y1="304" x2="72" y2="304" stroke-width="6"/>
      <line x1="52" y1="344" x2="112" y2="344" stroke-width="5"/>
    </g>

    <!-- ===== дальняя нога и дальний шатун (за рамой) ===== -->
    <path d="M246 214 L290 300 L303 396" fill="none" stroke="#cd7418" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M288 396 L318 400" fill="none" stroke="#b96612" stroke-width="11" stroke-linecap="round"/>
    <g transform="rotate(160 282 350)">
      <rect x="277" y="296" width="10" height="58" rx="5" fill="#6f7c88"/>
      <rect x="266" y="288" width="32" height="11" rx="5" fill="#22282e"/>
    </g>

    <!-- ===== колёса ===== -->
    <g transform="translate(162,350)">
      <circle r="86" fill="none" stroke="url(#tyreG)" stroke-width="15"/>
      <circle r="76" fill="none" stroke="#cfd8de" stroke-width="7"/>
      <circle r="72.5" fill="#eef4f7" opacity="0.35"/>
      <use href="#spokes"/>
      <circle r="11" fill="#8c99a5"/>
      <circle r="4.5" fill="#2b333b"/>
    </g>
    <g transform="translate(418,350)">
      <circle r="86" fill="none" stroke="url(#tyreG)" stroke-width="15"/>
      <circle r="76" fill="none" stroke="#cfd8de" stroke-width="7"/>
      <circle r="72.5" fill="#eef4f7" opacity="0.35"/>
      <use href="#spokes"/>
      <circle r="11" fill="#8c99a5"/>
      <circle r="4.5" fill="#2b333b"/>
    </g>

    <!-- ===== рама ===== -->
    <g fill="none" stroke="url(#frameG)" stroke-width="11" stroke-linecap="round">
      <path d="M162 350 L282 350"/>            <!-- нижнее перо -->
      <path d="M162 350 L230 228"/>            <!-- заднее перо -->
      <path d="M230 228 L282 350"/>            <!-- подседельная труба -->
      <path d="M234 224 L352 190"/>            <!-- верхняя труба -->
      <path d="M282 350 L355 192"/>            <!-- нижняя труба -->
    </g>
    <!-- вилка -->
    <g stroke="#c22e3b" stroke-width="7" stroke-linecap="round">
      <line x1="354" y1="192" x2="418" y2="350"/>
      <line x1="360" y1="196" x2="423" y2="349"/>
    </g>
    <!-- рулевой стакан -->
    <line x1="350" y1="194" x2="361" y2="171" stroke="#a9222f" stroke-width="15" stroke-linecap="round"/>
    <!-- вынос и руль -->
    <path d="M357 176 L344 156" stroke="#3a444f" stroke-width="9" stroke-linecap="round"/>
    <path d="M300 152 Q330 142 346 157" fill="none" stroke="#3a444f" stroke-width="8" stroke-linecap="round"/>
    <path d="M300 152 Q314 147 326 148" fill="none" stroke="#1c2228" stroke-width="13" stroke-linecap="round"/>
    <!-- седло и подседельный штырь -->
    <line x1="230" y1="228" x2="226" y2="210" stroke="#9aa6b1" stroke-width="9" stroke-linecap="round"/>
    <path d="M196 206 q30 -12 58 -4 q6 2 -2 8 q-28 8 -56 4 Z" fill="#2b333b"/>
    <!-- заднее крыло -->
    <path d="M92 322 A 90 90 0 0 0 216 292" fill="none" stroke="#e0525c" stroke-width="9" stroke-linecap="round"/>

    <!-- ===== трансмиссия ===== -->
    <circle cx="162" cy="350" r="14" fill="#4a555f"/>
    <circle cx="162" cy="350" r="6" fill="#22282e"/>
    <g stroke="#4a555f" stroke-width="5" stroke-linecap="round">
      <line x1="162" y1="336" x2="282" y2="326"/>
      <line x1="162" y1="364" x2="282" y2="374"/>
    </g>
    <circle cx="282" cy="350" r="24" fill="none" stroke="#7f8b96" stroke-width="7"/>
    <circle cx="282" cy="350" r="24" fill="none" stroke="#c3ced7" stroke-width="2" stroke-dasharray="4 6"/>
    <circle cx="282" cy="350" r="8" fill="#5b666f"/>
    <!-- ближний шатун и педаль -->
    <g transform="rotate(-20 282 350)">
      <rect x="277" y="296" width="10" height="58" rx="5" fill="#9aa6b1"/>
      <rect x="266" y="288" width="32" height="11" rx="5" fill="#2b333b"/>
    </g>

    <!-- ===== пеликан ===== -->
    <!-- хвост -->
    <path d="M164 186 q-34 -6 -48 16 q26 12 52 4 Z" fill="#dfe7ec"/>
    <path d="M166 192 q-28 -2 -40 10" fill="none" stroke="#c3cfd7" stroke-width="2.5"/>
    <!-- тело -->
    <ellipse cx="222" cy="186" rx="62" ry="45" transform="rotate(-10 222 186)" fill="url(#bodyG)"/>
    <path d="M184 216 q40 20 82 -4" fill="none" stroke="#cdd9e0" stroke-width="3" opacity="0.8"/>
    <!-- крыло -->
    <path d="M188 170 q42 -20 78 4 q-6 32 -42 38 q-34 4 -36 -42 Z" fill="#e8eef2" stroke="#c9d5dc" stroke-width="2.5"/>
    <g fill="none" stroke="#c9d5dc" stroke-width="2.5" stroke-linecap="round">
      <path d="M204 190 q22 8 46 2"/>
      <path d="M208 202 q20 6 40 0"/>
    </g>
    <!-- крыло-«рука» на руле -->
    <path d="M250 176 Q292 160 318 152 Q328 148 326 157 Q300 172 262 190 Q246 194 250 176 Z"
          fill="#eef3f6" stroke="#c9d5dc" stroke-width="2"/>
    <ellipse cx="322" cy="153" rx="10" ry="6.5" transform="rotate(-15 322 153)" fill="#eef3f6" stroke="#c9d5dc" stroke-width="1.6"/>
    <!-- шея -->
    <path d="M262 156 C276 122 288 100 302 86" fill="none" stroke="url(#bodyG)" stroke-width="30" stroke-linecap="round"/>
    <!-- голова -->
    <ellipse cx="308" cy="76" rx="23" ry="20" fill="url(#bodyG)"/>
    <!-- кепка -->
    <path d="M286 70 q6 -26 30 -22 q18 4 18 22 Z" fill="#2f6db5"/>
    <path d="M316 62 q26 -8 42 6 q-16 12 -42 6 Z" fill="#2f6db5"/>
    <path d="M316 62 q26 -8 42 6" fill="none" stroke="#245a99" stroke-width="2"/>
    <circle cx="306" cy="46" r="4" fill="#f2f6f9"/>
    <!-- глаз -->
    <circle cx="316" cy="74" r="6" fill="#ffffff"/>
    <circle cx="318" cy="74" r="3.4" fill="#20262c"/>
    <circle cx="319.4" cy="72.6" r="1.3" fill="#ffffff"/>
    <!-- горловой мешок -->
    <path d="M322 84 Q352 140 394 110 Q410 100 418 94 L322 82 Z" fill="url(#pouchG)"/>
    <!-- рыбка у кончика клюва -->
    <g>
      <ellipse cx="410" cy="102" rx="14" ry="8" transform="rotate(38 410 102)" fill="#5f8fb5"/>
      <path d="M420 92 l10 -10 q4 10 -6 14 Z" fill="#4b7ba3"/>
      <circle cx="404" cy="98" r="1.7" fill="#1d2b38"/>
    </g>
    <!-- верхняя часть клюва -->
    <path d="M322 66 L414 84 Q428 88 420 96 L322 84 Z" fill="url(#billG)"/>
    <path d="M332 70 L414 86" fill="none" stroke="#e2a04a" stroke-width="2" opacity="0.7"/>
    <path d="M322 83 Q372 92 416 93" fill="none" stroke="#dd8a24" stroke-width="2.5"/>
    <!-- ближняя нога (на педали) -->
    <path d="M238 206 L268 244 L258 288" fill="none" stroke="url(#legG)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M244 291 L288 291 q10 9 -2 13 l-42 0 q-9 -7 0 -13 Z" fill="#f2942f"/>
    <g stroke="#d97f1c" stroke-width="2">
      <line x1="258" y1="293" x2="258" y2="302"/>
      <line x1="270" y1="293" x2="270" y2="302"/>
    </g>
  </g>
</svg>
