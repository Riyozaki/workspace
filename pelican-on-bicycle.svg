<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480" role="img" aria-labelledby="t d">
  <title id="t">Пеликан на велосипеде</title>
  <desc id="d">Мультяшный пеликан с большим клювом едет на красном велосипеде, держась крылом за руль.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8f4fb"/>
      <stop offset="1" stop-color="#fbfdfe"/>
    </linearGradient>
    <clipPath id="bodyClip">
      <ellipse cx="266" cy="190" rx="62" ry="46" transform="rotate(-8 266 190)"/>
    </clipPath>
  </defs>

  <!-- ===== background ===== -->
  <rect x="0" y="0" width="640" height="480" fill="url(#sky)"/>
  <circle cx="562" cy="78" r="34" fill="#ffe9a8"/>
  <g fill="#ffffff" opacity="0.85">
    <ellipse cx="110" cy="86" rx="34" ry="14"/>
    <ellipse cx="140" cy="78" rx="26" ry="12"/>
    <ellipse cx="86" cy="78" rx="20" ry="10"/>
  </g>

  <!-- speed lines -->
  <g stroke="#a9cde2" stroke-width="5" stroke-linecap="round" opacity="0.8">
    <line x1="70" y1="292" x2="112" y2="292"/>
    <line x1="52" y1="322" x2="104" y2="322"/>
    <line x1="72" y1="352" x2="110" y2="352"/>
  </g>

  <!-- ground -->
  <ellipse cx="320" cy="414" rx="235" ry="13" fill="#000000" opacity="0.07"/>
  <line x1="40" y1="410" x2="600" y2="410" stroke="#d7dee2" stroke-width="3" stroke-linecap="round"/>

  <!-- ===== pelican: far leg (behind the frame) ===== -->
  <g id="far-leg">
    <path d="M 268 224 L 292 268 L 297 308" fill="none" stroke="#d97b2f" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="282" y="308" width="26" height="9" rx="4" fill="#d97b2f"/>
  </g>

  <!-- ===== bicycle ===== -->
  <g id="bike">
    <!-- rear wheel -->
    <g>
      <circle cx="185" cy="342" r="64" fill="none" stroke="#2b2b30" stroke-width="9"/>
      <circle cx="185" cy="342" r="56" fill="none" stroke="#c9ced3" stroke-width="4"/>
      <g stroke="#b7bdc4" stroke-width="2.5" transform="translate(185,342)">
        <line x1="-56" y1="0" x2="56" y2="0"/>
        <line x1="-56" y1="0" x2="56" y2="0" transform="rotate(30)"/>
        <line x1="-56" y1="0" x2="56" y2="0" transform="rotate(60)"/>
        <line x1="-56" y1="0" x2="56" y2="0" transform="rotate(90)"/>
        <line x1="-56" y1="0" x2="56" y2="0" transform="rotate(120)"/>
        <line x1="-56" y1="0" x2="56" y2="0" transform="rotate(150)"/>
      </g>
      <circle cx="185" cy="342" r="8" fill="#6b7075"/>
    </g>

    <!-- front wheel -->
    <g>
      <circle cx="455" cy="342" r="64" fill="none" stroke="#2b2b30" stroke-width="9"/>
      <circle cx="455" cy="342" r="56" fill="none" stroke="#c9ced3" stroke-width="4"/>
      <g stroke="#b7bdc4" stroke-width="2.5" transform="translate(455,342)">
        <line x1="-56" y1="0" x2="56" y2="0"/>
        <line x1="-56" y1="0" x2="56" y2="0" transform="rotate(30)"/>
        <line x1="-56" y1="0" x2="56" y2="0" transform="rotate(60)"/>
        <line x1="-56" y1="0" x2="56" y2="0" transform="rotate(90)"/>
        <line x1="-56" y1="0" x2="56" y2="0" transform="rotate(120)"/>
        <line x1="-56" y1="0" x2="56" y2="0" transform="rotate(150)"/>
      </g>
      <circle cx="455" cy="342" r="8" fill="#6b7075"/>
    </g>

    <!-- chain -->
    <g stroke="#7a7f85" stroke-width="3">
      <line x1="185" y1="335" x2="320" y2="333"/>
      <line x1="185" y1="349" x2="320" y2="351"/>
    </g>
    <circle cx="185" cy="342" r="10" fill="#565b61"/>

    <!-- frame -->
    <g stroke="#e4572e" stroke-width="8" stroke-linecap="round" fill="none">
      <line x1="185" y1="342" x2="320" y2="342"/>   <!-- chainstay -->
      <line x1="185" y1="342" x2="292" y2="252"/>   <!-- seatstay -->
      <line x1="320" y1="342" x2="292" y2="252"/>   <!-- seat tube -->
      <line x1="320" y1="342" x2="403" y2="264"/>   <!-- down tube -->
      <line x1="292" y1="252" x2="403" y2="250"/>   <!-- top tube -->
      <line x1="403" y1="264" x2="455" y2="342"/>   <!-- fork -->
    </g>
    <line x1="403" y1="244" x2="403" y2="266" stroke="#e4572e" stroke-width="11" stroke-linecap="round"/>

    <!-- seatpost + saddle -->
    <line x1="292" y1="252" x2="288" y2="241" stroke="#6b7075" stroke-width="6" stroke-linecap="round"/>
    <path d="M 259 238 C 267 229, 297 227, 315 233 C 321 236, 319 243, 310 244 L 267 245 C 257 245, 253 241, 259 238 Z" fill="#2b2b30"/>

    <!-- stem + handlebar -->
    <line x1="403" y1="248" x2="399" y2="233" stroke="#6b7075" stroke-width="6" stroke-linecap="round"/>
    <path d="M 382 235 Q 399 223, 418 230" fill="none" stroke="#2b2b30" stroke-width="7" stroke-linecap="round"/>

    <!-- crankset: far crank + pedal -->
    <line x1="320" y1="342" x2="295" y2="322" stroke="#3a3e44" stroke-width="7" stroke-linecap="round"/>
    <rect x="283" y="316" width="24" height="8" rx="3" fill="#2b2b30"/>
    <circle cx="320" cy="342" r="22" fill="none" stroke="#4a4e54" stroke-width="5"/>
  </g>

  <!-- ===== pelican ===== -->
  <g id="pelican">
    <!-- tail feathers -->
    <path d="M 216 174 C 190 154, 161 149, 145 158 C 162 168, 165 176, 151 184 C 172 199, 201 201, 219 192 Z" fill="#e8e2d2"/>

    <!-- body -->
    <ellipse cx="266" cy="190" rx="62" ry="46" transform="rotate(-8 266 190)" fill="#f6f3ec"/>
    <g clip-path="url(#bodyClip)">
      <path d="M 195 205 Q 266 244 337 200 L 337 250 L 195 250 Z" fill="#e9e3d4" opacity="0.8"/>
    </g>

    <!-- neck + head -->
    <path d="M 298 176 C 302 140, 316 116, 340 106" fill="none" stroke="#f6f3ec" stroke-width="38" stroke-linecap="round"/>
    <circle cx="346" cy="108" r="28" fill="#f6f3ec"/>

    <!-- small crest -->
    <path d="M 334 84 C 328 72, 330 63, 337 57 C 341 65, 342 74, 341 83 Z" fill="#e8e2d2"/>

    <!-- beak: upper mandible -->
    <path d="M 352 94 C 394 100, 432 116, 458 132 C 463 135, 459 142, 452 140 C 426 130, 386 120, 354 116 Z" fill="#f5a623"/>
    <!-- beak: lower mandible + pouch -->
    <path d="M 354 116 C 386 121, 426 131, 452 140 C 449 166, 426 186, 397 187 C 368 188, 351 152, 354 116 Z" fill="#f9c469"/>
    <path d="M 358 121 C 388 127, 422 136, 446 145" fill="none" stroke="#e8a94f" stroke-width="2.5" stroke-linecap="round"/>

    <!-- eye -->
    <circle cx="353" cy="100" r="4.5" fill="#2b2b30"/>
    <circle cx="354.6" cy="98.4" r="1.6" fill="#ffffff"/>

    <!-- wing holding the handlebar -->
    <path d="M 272 166 C 315 160, 355 182, 385 210 C 395 219, 402 226, 405 231 C 408 237, 402 242, 396 239 C 378 231, 352 220, 322 212 C 300 206, 278 202, 268 192 C 260 183, 262 170, 272 166 Z"
          fill="#ece6d6" stroke="#d3c9b2" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M 292 180 C 320 186, 350 200, 376 218" fill="none" stroke="#d3c9b2" stroke-width="2.5" stroke-linecap="round"/>

    <!-- near leg (in front of the frame, on the near pedal) -->
    <path d="M 288 228 L 328 278 L 345 346" fill="none" stroke="#ef8f3c" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="333" y="346" width="28" height="10" rx="4" fill="#ef8f3c"/>
  </g>

  <!-- near crank + pedal (over the foot edge for a planted look) -->
  <g id="near-crank">
    <line x1="320" y1="342" x2="347" y2="360" stroke="#3a3e44" stroke-width="7" stroke-linecap="round"/>
    <rect x="335" y="354" width="24" height="8" rx="3" fill="#2b2b30"/>
    <circle cx="320" cy="342" r="6" fill="#2b2b30"/>
  </g>
</svg>
