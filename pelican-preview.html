  <p class="note">Колёса крутятся, спицы и «линии скорости» анимированы через CSS внутри файла.
  При <code>prefers-reduced-motion</code> анимация отключается автоматически.</p>

<script>
  var card = document.getElementById('card');
  var bgs = { sky: '', white: 'background:#fff', dark: 'background:#121820' };
  document.querySelectorAll('[data-bg]').forEach(function (b) {
    b.addEventListener('click', function () {
      document.querySelectorAll('[data-bg]').forEach(function (o) { o.setAttribute('aria-pressed', String(o === b)); });
      card.setAttribute('style', bgs[b.dataset.bg]);
    });
  });
  document.getElementById('pause').addEventListener('click', function () {
    var on = card.classList.toggle('pause');
    this.textContent = on ? 'Продолжить' : 'Пауза анимации';
  });
</script>
</body>
</html>
