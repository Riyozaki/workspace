<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 360 420" width="360" height="420" role="img"
     aria-label="Белый пеликан едет на красном велосипеде">
  <title>Пеликан на велосипеде</title>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a587f"/>
      <stop offset="0.5" stop-color="#3d8dad"/>
      <stop offset="1" stop-color="#93d3dd"/>
    </linearGradient>
    <linearGradient id="bodyG" x1="0.15" y1="0" x2="0.65" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#f4f7fb"/>
      <stop offset="1" stop-color="#cdd7e6"/>
    </linearGradient>
    <linearGradient id="wingG" x1="0.85" y1="0" x2="0.1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#f2f5fa"/>
      <stop offset="1" stop-color="#cfd9e8"/>
    </linearGradient>
    <linearGradient id="beakG" x1="0.9" y1="0.1" x2="0.1" y2="0.9">
      <stop offset="0" stop-color="#ffd580"/>
      <stop offset="0.6" stop-color="#f7ae35"/>
      <stop offset="1" stop-color="#e08a1b"/>
    </linearGradient>
    <linearGradient id="pouchG" x1="0.85" y1="0.05" x2="0.2" y2="1">
      <stop offset="0" stop-color="#f9b756"/>
      <stop offset="0.55" stop-color="#e9962c"/>
      <stop offset="1" stop-color="#cd6f16"/>
    </linearGradient>
    <linearGradient id="legFar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e59536"/>
      <stop offset="1" stop-color="#c4761b"/>
    </linearGradient>
    <linearGradient id="legNear" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#f6ac4d"/>
      <stop offset="1" stop-color="#dd8b26"/>
    </linearGradient>
    <linearGradient id="frameG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0705f"/>
      <stop offset="1" stop-color="#bb3527"/>
    </linearGradient>
    <linearGradient id="groundG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4b5762"/>
      <stop offset="1" stop-color="#2a323b"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.55" stop-color="#ffe07a" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#ffe07a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shadowG" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0c1822" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#0c1822" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="card"><rect width="360" height="420" rx="26"/></clipPath>

    <g id="wheelRig">
      <circle r="52" fill="none" stroke="#242b35" stroke-width="11"/>
      <circle r="46.5" fill="none" stroke="#bcc6d4" stroke-width="5"/>
      <g stroke="#c9d2df" stroke-width="1.4" opacity="0.95">
        <line y2="-44"/>
        <line y2="-44" transform="rotate(30)"/>
        <line y2="-44" transform="rotate(60)"/>
        <line y2="-44" transform="rotate(90)"/>
        <line y2="-44" transform="rotate(120)"/>
        <line y2="-44" transform="rotate(150)"/>
      </g>
      <circle r="8" fill="#98a3b3"/>
      <circle r="3.4" fill="#5d6775"/>
    </g>
  </defs>

  <g clip-path="url(#card)">
    <!-- ================= фон ================= -->
    <rect width="360" height="420" fill="url(#sky)"/>
    <circle cx="302" cy="70" r="29" fill="#ffeaa8" opacity="0.92"/>
    <circle cx="302" cy="70" r="46" fill="url(#moonGlow)"/>
    <path d="M0,300 C40,266 88,282 130,272 C186,258 236,282 292,268 C322,260 346,266 360,274 L360,320 L0,320 Z"
          fill="#2b6d80" opacity="0.55"/>
    <path d="M0,318 C52,300 96,312 148,304 C210,294 262,314 316,304 C338,300 352,304 360,308 L360,330 L0,330 Z"
          fill="#1f5566" opacity="0.75"/>

    <rect y="318" width="360" height="102" fill="url(#groundG)"/>
    <g stroke="#e8eef5" stroke-width="4" stroke-dasharray="26 20" opacity="0.5">
      <line x1="-10" y1="382" x2="370" y2="382"/>
    </g>
    <ellipse cx="150" cy="330" rx="152" ry="16" fill="url(#shadowG)"/>

    <g stroke="#dcf1f7" stroke-width="3.4" stroke-linecap="round" opacity="0.5" fill="none">
      <path d="M286,132 H330"/>
      <path d="M300,154 H342"/>
      <path d="M276,176 H312"/>
      <path d="M308,200 h30"/>
      <path d="M282,222 h26"/>
    </g>

    <!-- ================= дальнее крыло (сложено на спине) ================= -->
    <path d="M162,78 C186,80 202,92 208,106 C200,114 190,116 184,112 C182,96 174,86 158,84 Z"
          fill="#c6d0df"/>
    <path d="M166,84 C182,88 194,96 200,106" stroke="#b3bfd1" stroke-width="1.6" fill="none"/>

    <!-- ================= велосипед ================= -->
    <use xlink:href="#wheelRig" href="#wheelRig" transform="translate(60,262)"/>
    <use xlink:href="#wheelRig" href="#wheelRig" transform="translate(228,262)"/>

    <path d="M164,250 L220,253" stroke="#5a6472" stroke-width="3.4" fill="none"/>
    <path d="M164,274 L220,271" stroke="#5a6472" stroke-width="3.4" fill="none"/>
    <circle cx="228" cy="262" r="9" fill="none" stroke="#8f99a8" stroke-width="3.4"/>
    <g stroke="#6d7787" stroke-width="6.5" stroke-linecap="round">
      <line x1="146" y1="262" x2="166" y2="249"/>
      <line x1="146" y1="262" x2="135" y2="275"/>
    </g>
    <circle cx="146" cy="262" r="18" fill="none" stroke="#98a3b3" stroke-width="4"/>
    <circle cx="146" cy="262" r="5" fill="#5d6775"/>
    <rect x="155" y="244" width="24" height="9" rx="3" fill="#39404c" transform="rotate(25 166 249)"/>
    <rect x="123" y="270" width="24" height="9" rx="3" fill="#39404c" transform="rotate(-32 135 275)"/>

    <g stroke="url(#frameG)" stroke-width="9" stroke-linecap="round" fill="none">
      <path d="M146,262 L72,212"/>
      <path d="M146,262 L191,166"/>
      <path d="M191,166 L82,190"/>
      <path d="M146,262 L228,262"/>
      <path d="M191,166 L228,262"/>
      <path d="M72,212 L80,190"/>
    </g>
    <path d="M74,210 C68,228 64,246 61,256" stroke="#d9534a" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M82,190 L92,174" stroke="#9aa4b2" stroke-width="7" stroke-linecap="round"/>
    <path d="M60,178 C72,164 96,163 112,171 C121,175 123,184 117,192"
          stroke="#39404c" stroke-width="8.5" fill="none" stroke-linecap="round"/>
    <circle cx="61" cy="179" r="5.6" fill="#282e36"/>
    <circle cx="117" cy="191" r="5.6" fill="#282e36"/>

    <!-- ================= дальняя нога (на задней педали) ================= -->
    <path d="M166,152 C152,166 132,181 124,197 C122,216 126,246 131,268"
          stroke="url(#legFar)" stroke-width="11" stroke-linecap="round" fill="none"/>
    <path d="M130,266 C123,271 120,279 124,284 C131,288 142,284 144,277
             C142,270 136,265 130,266 Z" fill="#c4761b"/>
    <path d="M125,271 L120,281 M132,271 L132,284 M139,273 L142,283"
          stroke="#a8620f" stroke-width="1.5" fill="none" opacity="0.6"/>

    <!-- ================= седло ================= -->
    <path d="M173,160 C181,151 203,150 212,157 C207,167 187,170 173,160 Z" fill="#4a3327"/>
    <rect x="186" y="159" width="8" height="12" rx="3" fill="#7d8894"/>

    <!-- ================= корпус ================= -->
    <path d="M188,102 C208,96 228,94 242,98 C231,109 214,118 194,124 Z" fill="#e2e8f1"/>
    <path d="M192,116 C210,115 228,119 239,126 C224,134 206,134 192,128 Z" fill="#cfd8e6"/>

    <path d="M110,84 C136,58 182,74 197,110 C207,131 201,154 188,164
             C162,173 130,160 114,140 C102,125 100,100 110,84 Z" fill="url(#bodyG)"/>
    <path d="M172,152 C188,154 197,148 201,134 C203,152 195,162 183,165 C177,160 173,156 172,152 Z"
          fill="#c4cfdf" opacity="0.7"/>
    <g stroke="#dde5f0" stroke-width="2" fill="none" opacity="0.85">
      <path d="M126,110 C142,118 160,126 178,130"/>
      <path d="M120,128 C138,136 156,142 174,146"/>
    </g>
    <!-- плечо, из которого растёт ближнее крыло -->
    <path d="M150,78 C164,80 174,90 178,102 C168,100 158,92 150,84 Z" fill="#e2e9f3" opacity="0.9"/>

    <!-- шея -->
    <path d="M134,90 C117,71 106,58 109,42" stroke="url(#bodyG)" stroke-width="36"
          stroke-linecap="round" fill="none"/>
    <path d="M120,92 C104,76 96,62 99,46" stroke="#ffffff" stroke-width="3.4"
          stroke-linecap="round" fill="none" opacity="0.55"/>

    <!-- ================= голова и клюв ================= -->
    <circle cx="104" cy="42" r="26" fill="url(#bodyG)"/>
    <!-- хохолок на затылке -->
    <path d="M120,21 C131,17 139,22 141,31 C132,27 126,31 124,40 C118,34 116,26 120,21 Z" fill="#e6ebf3"/>

    <!-- подклювный мешок -->
    <path d="M88,40 C61,45 34,51 8,47 C18,73 48,91 78,77 C90,67 93,52 88,40 Z" fill="url(#pouchG)"/>
    <path d="M88,40 C63,45 39,50 11,47 C26,61 49,70 70,68 C83,63 91,51 88,40 Z"
          fill="#ffffff" opacity="0.26"/>
    <path d="M12,47 C38,60 62,64 80,58" stroke="#c46a12" stroke-width="1.6" fill="none" opacity="0.35"/>
    <!-- верхняя створка -->
    <path d="M86,24 C57,26 27,34 8,44 C36,49 63,45 88,38 Z" fill="url(#beakG)"/>
    <path d="M8,44 C2,45 -1,50 0,56 C5,57 10,52 11,47 Z" fill="#d97c17"/>
    <path d="M8,44 C36,49 63,45 88,38" stroke="#c9701a" stroke-width="2" fill="none" opacity="0.7"/>
    <path d="M80,29 C57,31 34,37 19,43" stroke="#ffffff" stroke-width="3.4" fill="none" opacity="0.5"/>

    <circle cx="97" cy="34" r="6.6" fill="#ffffff"/>
    <circle cx="95" cy="34.5" r="3.7" fill="#26313f"/>
    <circle cx="93.5" cy="32.4" r="1.4" fill="#ffffff"/>

    <!-- ================= ближняя нога (на передней педали) ================= -->
    <path d="M178,162 C174,178 166,190 158,202 C155,216 157,232 162,246"
          stroke="url(#legNear)" stroke-width="12" stroke-linecap="round" fill="none"/>
    <path d="M162,244 C170,241 179,245 180,252 C179,259 169,262 162,257
             C156,253 156,247 162,244 Z" fill="#dd8b26"/>
    <path d="M169,244 L167,256 M175,246 L176,258 M162,245 L159,256"
          stroke="#ba6f12" stroke-width="1.5" fill="none" opacity="0.6"/>

    <!-- ================= ближнее крыло-рука на руле ================= -->
    <path d="M158,80 C138,84 112,102 88,126 C78,138 70,152 66,166
             C68,180 76,190 88,194 C104,182 120,164 134,146
             C148,128 160,108 168,96 C170,88 166,78 158,80 Z" fill="url(#wingG)"/>
    <path d="M104,182 C120,168 138,148 152,128" stroke="#bcc7d8" stroke-width="3"
          fill="none" opacity="0.35"/>
    <g stroke="#c3cedd" stroke-width="1.6" fill="none" opacity="0.7">
      <path d="M150,90 C130,106 110,128 94,148"/>
      <path d="M144,90 C124,108 104,130 88,152"/>
    </g>
    <!-- кончик крыла, сомкнутый на руле -->
    <path d="M64,166 C54,166 46,173 45,181 C46,190 56,196 66,193
             C76,190 82,182 80,174 C78,169 72,166 64,166 Z" fill="#dbe3f0"/>
    <g stroke="#bcc7d8" stroke-width="1.5" fill="none" opacity="0.9">
      <path d="M56,172 C53,179 54,187 58,192"/>
      <path d="M66,171 C64,179 65,187 68,192"/>
    </g>
    <!-- конец руля проходит сквозь «ладонь» + большой палец -->
    <path d="M62,177 C74,169 88,167 100,170" stroke="#39404c" stroke-width="8.5"
          fill="none" stroke-linecap="round"/>
    <path d="M68,182 C74,178 80,175 86,173" stroke="#dbe3f0" stroke-width="9"
          fill="none" stroke-linecap="round"/>
    <path d="M68,182 C74,178 80,175 86,173" stroke="#c3cedd" stroke-width="1.4"
          fill="none" opacity="0.7"/>

    <!-- контровой свет по спине -->
    <path d="M118,86 C138,62 178,72 196,104" stroke="#ffffff" stroke-width="4"
          fill="none" opacity="0.75" stroke-linecap="round"/>
    <path d="M134,86 C120,72 112,60 113,46" stroke="#ffffff" stroke-width="4"
          fill="none" opacity="0.6" stroke-linecap="round"/>

    <!-- дальние птицы -->
    <g stroke="#e6f4f8" stroke-width="2.4" fill="none" opacity="0.55" stroke-linecap="round">
      <path d="M232,58 C238,52 242,52 246,57 C250,52 254,52 260,58"/>
      <path d="M262,92 C266,88 269,88 272,91 C275,88 278,88 282,92"/>
    </g>

    <!-- блики -->
    <ellipse cx="126" cy="92" rx="17" ry="9" fill="#ffffff" opacity="0.6" transform="rotate(-24 126 92)"/>
    <ellipse cx="304" cy="140" rx="24" ry="8" fill="#ffffff" opacity="0.12"/>
  </g>
</svg>
